<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="480" fill="#ffffff" />

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">
    Real-Time Food Delivery Updates - Apache Kafka Architecture
  </text>

  <!-- Order service -->
  <rect x="60" y="90" width="200" height="90" rx="10" fill="#e8f0fe" stroke="#3b6fd6" stroke-width="2"/>
  <text x="160" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Order Service</text>
  <text x="160" y="145" text-anchor="middle" font-size="12" fill="#333">Node.js + Express</text>
  <text x="160" y="162" text-anchor="middle" font-size="12" fill="#333">Kafka Producer</text>

  <!-- Kafka -->
  <rect x="400" y="200" width="200" height="110" rx="10" fill="#fff3e0" stroke="#e07b00" stroke-width="2"/>
  <text x="500" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Apache Kafka</text>
  <text x="500" y="252" text-anchor="middle" font-size="12" fill="#333">topic: order.status.updated</text>
  <text x="500" y="270" text-anchor="middle" font-size="12" fill="#333">retains events on disk -</text>
  <text x="500" y="286" text-anchor="middle" font-size="12" fill="#333">consumers can restart and replay</text>

  <!-- Customer service -->
  <rect x="740" y="30" width="210" height="90" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="845" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Customer Service</text>
  <text x="845" y="85" text-anchor="middle" font-size="12" fill="#333">Kafka Consumer group:</text>
  <text x="845" y="102" text-anchor="middle" font-size="12" fill="#333">customer-service-group</text>

  <!-- Rider service -->
  <rect x="740" y="150" width="210" height="90" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="845" y="185" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Rider Service</text>
  <text x="845" y="205" text-anchor="middle" font-size="12" fill="#333">Kafka Consumer group:</text>
  <text x="845" y="222" text-anchor="middle" font-size="12" fill="#333">rider-service-group</text>

  <!-- Notification service -->
  <rect x="740" y="270" width="210" height="90" rx="10" fill="#e6f4ea" stroke="#1e8e3e" stroke-width="2"/>
  <text x="845" y="305" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Notification Service</text>
  <text x="845" y="325" text-anchor="middle" font-size="12" fill="#333">Kafka Consumer group:</text>
  <text x="845" y="342" text-anchor="middle" font-size="12" fill="#333">notification-service-group</text>

  <!-- arrows order -> kafka -->
  <path d="M260,160 C330,160 340,220 400,245" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="150" font-size="12" fill="#555">publish event</text>

  <!-- kafka -> consumers -->
  <path d="M600,235 C670,180 700,130 740,90" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,255 C660,255 690,220 740,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M600,275 C670,300 700,300 740,310" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="655" y="150" font-size="12" fill="#555">consume independently</text>

  <!-- key point box -->
  <rect x="60" y="380" width="890" height="70" rx="10" fill="#fdecea" stroke="#c5221f" stroke-width="1.5"/>
  <text x="80" y="405" font-size="13" fill="#7a1f1a" font-weight="bold">Pain point being solved:</text>
  <text x="80" y="425" font-size="12.5" fill="#333">
    Without Kafka, Order Service would call Customer / Rider / Notification services directly.
  </text>
  <text x="80" y="442" font-size="12.5" fill="#333">
    If one is temporarily down (e.g. rider service), that update is lost. With Kafka, each service reads at its own pace and never misses an event.
  </text>
</svg>
