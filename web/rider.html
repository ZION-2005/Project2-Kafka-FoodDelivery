<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saffron &middot; Rider</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">S</span>
        <span class="brand-name">Saffron</span>
      </a>
      <nav class="topnav">
        <span class="nav-item active">Rider</span>
      </nav>
      <div class="topbar-right hidden" id="sessionBar">
        <span class="session-name" id="sessionName"></span>
        <button class="btn btn-ghost" id="signOutBtn">Sign out</button>
      </div>
    </header>

    <div class="identify-screen" id="identifyCard">
      <div class="identify-card">
        <h2>Rider sign in</h2>
        <p class="muted">Enter your name to see available pickups.</p>
        <form id="identifyForm">
          <input type="text" id="riderIdInput" placeholder="Full name" required />
          <button type="submit" class="btn btn-primary">Continue</button>
        </form>
      </div>
    </div>

    <main class="narrow-layout hidden" id="riderView">
      <section class="rider-section">
        <h3>Available Pickups</h3>
        <div id="poolList" class="rider-grid"></div>
      </section>

      <section class="rider-section">
        <h3>My Deliveries</h3>
        <div id="myList" class="rider-grid"></div>
      </section>
    </main>
  </div>

  <script src="rider.js"></script>
</body>
</html>
