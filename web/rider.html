<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Saffron &middot; Rider</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-mark">S</span>
        <span class="brand-name">Saffron</span>
      </a>
      <nav class="topnav">
        <span class="nav-item active">Rider</span>
      </nav>
    </header>

    <main class="narrow-layout">
      <div class="identify-card" id="identifyCard">
        <h2>Sign in as a rider</h2>
        <p class="muted">Enter your name to see available pickups.</p>
        <form id="identifyForm">
          <input type="text" id="riderIdInput" placeholder="e.g. Nok-29" required />
          <button type="submit" class="btn btn-primary">Go online</button>
        </form>
      </div>

      <div id="riderView" class="hidden">
        <div class="tracking-head">
          <div>
            <div class="muted">Signed in as</div>
            <h2 id="riderLabel">&mdash;</h2>
          </div>
          <button class="btn btn-ghost" id="signOutBtn">Sign out</button>
        </div>

        <section class="rider-section">
          <h3>Available Pickups</h3>
          <div id="poolList" class="rider-grid"></div>
        </section>

        <section class="rider-section">
          <h3>My Deliveries</h3>
          <div id="myList" class="rider-grid"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="rider.js"></script>
</body>
</html>
